name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Detect APK filename
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          files=(app/build/outputs/apk/debug/AVDv*.apk)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${files[0]}" .apk)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error


      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${APK_NAME#AVD}-build.${GITHUB_RUN_NUMBER}"
          title="${APK_NAME} · Build ${GITHUB_RUN_NUMBER}"
          notes="${RUNNER_TEMP}/apk-release-notes.md"
          cat > "$notes" <<EOF
          Android APK를 아래 Assets에서 바로 다운로드하여 설치하세요.

          - APK: ${APK_NAME}.apk
          - 소스 커밋: ${GITHUB_SHA}
          - 빌드: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Debug APK입니다. 기존 앱과 서명이 같아야 덮어쓰기 업데이트가 가능합니다.
          - 로그인 유지 및 파일 선택 개선은 서버 v61 이상을 함께 적용하세요.
          EOF
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --draft
          fi
          gh release upload "$tag" "$APK_PATH" --clobber
          gh release edit "$tag" --draft=false --latest --title "$title" --notes-file "$notes"
          {
            echo "### APK 다운로드"
            echo "[${APK_NAME}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${APK_NAME}.apk)"
            echo ""
            echo "[릴리스 보기](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})"
          } >> "$GITHUB_STEP_SUMMARY"

