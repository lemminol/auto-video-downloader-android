plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('AVD_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('AVD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('AVD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('AVD_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace 'com.lemminol.avd'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lemminol.avd'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '1.1.15'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AGP 9.4.0-safe APK naming.
// Do not use the removed legacy applicationVariants API here.
def avdVersionName = android.defaultConfig.versionName

tasks.register("copyRenamedDebugApk") {
    group = "build"
    description = "Create AVDv<version>.apk after a debug APK build"
    doLast {
        def apkDir = layout.buildDirectory.dir("outputs/apk/debug").get().asFile
        def sourceApk = new File(apkDir, "app-debug.apk")
        if (!sourceApk.exists()) {
            throw new GradleException("Debug APK not found: ${sourceApk}")
        }
        def renamedApk = new File(apkDir, "AVDv${avdVersionName}.apk")
        copy {
            from sourceApk
            into apkDir
            rename { renamedApk.name }
        }
        println "AVD APK: ${renamedApk}"
    }
}

tasks.matching { it.name == "assembleDebug" }.configureEach {
    finalizedBy("copyRenamedDebugApk")
}

tasks.register("copyRenamedReleaseApk") {
    group = "build"
    description = "Create a consistently signed AVDv<version>.apk"
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException("Release signing variables are missing")
        }
        def apkDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
        def sourceApk = new File(apkDir, "app-release.apk")
        if (!sourceApk.exists()) {
            throw new GradleException("Signed release APK not found: ${sourceApk}")
        }
        copy {
            from sourceApk
            into apkDir
            rename { "AVDv${avdVersionName}.apk" }
        }
    }
}

tasks.matching { it.name == "assembleRelease" }.configureEach {
    doFirst {
        if (!releaseSigningReady) {
            throw new GradleException("Release signing requires AVD_KEYSTORE_PATH, AVD_KEYSTORE_PASSWORD, AVD_KEY_ALIAS and AVD_KEY_PASSWORD")
        }
    }
    finalizedBy("copyRenamedReleaseApk")
}
