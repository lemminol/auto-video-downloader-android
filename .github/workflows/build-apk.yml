name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  TZ: Asia/Seoul
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore persistent release signing key
        env:
          AVD_KEYSTORE_BASE64: ${{ secrets.AVD_KEYSTORE_BASE64 }}
          AVD_KEYSTORE_PASSWORD: ${{ secrets.AVD_KEYSTORE_PASSWORD }}
          AVD_KEY_ALIAS: ${{ secrets.AVD_KEY_ALIAS }}
          AVD_KEY_PASSWORD: ${{ secrets.AVD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AVD_KEYSTORE_BASE64 AVD_KEYSTORE_PASSWORD AVD_KEY_ALIAS AVD_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing GitHub Actions secret: ${name}" >&2; exit 1; }
          done
          keystore="${RUNNER_TEMP}/avd-release.jks"
          printf '%s' "$AVD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "AVD_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          AVD_KEYSTORE_PASSWORD: ${{ secrets.AVD_KEYSTORE_PASSWORD }}
          AVD_KEY_ALIAS: ${{ secrets.AVD_KEY_ALIAS }}
          AVD_KEY_PASSWORD: ${{ secrets.AVD_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Detect APK filename
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          files=(app/build/outputs/apk/release/AVDv*.apk)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          echo "built_at=$(date '+%Y-%m-%d %H:%M:%S KST (%z)')" >> "$GITHUB_OUTPUT"
          echo "modified_at=$(date -r "${files[0]}" '+%Y-%m-%d %H:%M:%S KST (%z)')" >> "$GITHUB_OUTPUT"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${files[0]}" .apk)" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and version
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "$APK_PATH"
          aapt dump badging "$APK_PATH" | head -n 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error


      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          BUILT_AT_KST: ${{ steps.apk.outputs.built_at }}
          MODIFIED_AT_KST: ${{ steps.apk.outputs.modified_at }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${APK_NAME#AVD}-build.${GITHUB_RUN_NUMBER}"
          title="${APK_NAME} · Build ${GITHUB_RUN_NUMBER}"
          notes="${RUNNER_TEMP}/apk-release-notes.md"
          cat > "$notes" <<EOF
          Android APK를 아래 Assets에서 바로 다운로드하여 설치하세요.

          - APK: ${APK_NAME}.apk
          - 빌드 완료 확인 시간: ${BUILT_AT_KST}
          - 빌드 서버 APK 최종 수정 시간: ${MODIFIED_AT_KST}
          - 내려받은 파일의 생성·수정 시간 표시는 기기 시간대와 다운로드 앱에 따라 달라질 수 있습니다.
          - 소스 커밋: ${GITHUB_SHA}
          - 빌드: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - GitHub Secrets의 고정 릴리스 키로 서명된 APK입니다.
          - 최초 고정키 전환 때 한 번 삭제 후 설치하면 이후 버전은 덮어쓰기 업데이트할 수 있습니다.
          - 로그인 유지 및 파일 선택 개선은 서버 v61 이상을 함께 적용하세요.
          EOF
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --draft
          fi
          gh release upload "$tag" "$APK_PATH" --clobber
          gh release edit "$tag" --draft=false --latest --title "$title" --notes-file "$notes"
          {
            echo "### APK 다운로드"
            echo "빌드 완료 확인: ${BUILT_AT_KST}"
            echo "APK 최종 수정: ${MODIFIED_AT_KST}"
            echo ""
            echo "[${APK_NAME}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${APK_NAME}.apk)"
            echo ""
            echo "[릴리스 보기](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})"
          } >> "$GITHUB_STEP_SUMMARY"

